name: Bug
description: Something in markme does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to see it again. A small Markdown sample helps.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: markme version
      placeholder: "1.0"
    validations:
      required: false
